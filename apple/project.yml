name: Tasks
options:
  bundleIdPrefix: com.example.tasks
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Tasks
    INFOPLIST_KEY_CFBundleName: Tasks
    ENABLE_HARDENED_RUNTIME: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  configs:
    Debug:
      APNS_ENVIRONMENT: development
    Release:
      APNS_ENVIRONMENT: production
targets:
  Tasks-iOS:
    type: application
    platform: iOS
    sources: [Tasks]
    settings:
      base:
        PRODUCT_NAME: Tasks
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tasks.ios
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
    entitlements:
      path: iOS.entitlements
      properties:
        aps-environment: $(APNS_ENVIRONMENT)
        com.apple.developer.applesignin: [Default]
  Tasks-macOS:
    type: application
    platform: macOS
    sources: [Tasks]
    settings:
      base:
        PRODUCT_NAME: Tasks
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tasks.macos
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    entitlements:
      path: macOS.entitlements
      properties:
        com.apple.developer.aps-environment: $(APNS_ENVIRONMENT)
        com.apple.developer.applesignin: [Default]
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
  Tasks-iOS-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TasksUITests]
    dependencies:
      - target: Tasks-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tasks.uitests
        TEST_TARGET_NAME: Tasks-iOS
schemes:
  Tasks-iOS:
    build:
      targets:
        Tasks-iOS: all
        Tasks-iOS-UITests: [test]
    test:
      targets: [Tasks-iOS-UITests]
