name: Tasks
options:
  bundleIdPrefix: com.example.tasks
  deploymentTarget:
    iOS: '27.0'
    macOS: '27.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Tasks
    INFOPLIST_KEY_CFBundleName: Tasks
    ENABLE_HARDENED_RUNTIME: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  configs:
    Debug:
      APNS_ENVIRONMENT: development
    Release:
      APNS_ENVIRONMENT: production
targets:
  Tasks-iOS:
    type: application
    platform: iOS
    sources:
      - Tasks
      - &appIcon
        # Icon Composer bundle. Xcode builds the AppIcon from it in place of the image set.
        path: ../design/app-icon/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - target: Tasks-NotificationService-iOS
    info:
      path: Tasks/Info-iOS.plist
      properties:
        UIBackgroundModes: [remote-notification]
        NSAlarmKitUsageDescription: Alarm-style reminders ring at the reminder time.
    settings:
      base:
        PRODUCT_NAME: Tasks
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tasks.ios
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
    entitlements:
      path: iOS.entitlements
      properties:
        aps-environment: $(APNS_ENVIRONMENT)
        com.apple.developer.applesignin: [Default]
        com.apple.developer.usernotifications.time-sensitive: true
  Tasks-macOS:
    type: application
    platform: macOS
    sources:
      - path: Tasks
        excludes: [Alarms.swift, Info-iOS.plist]
      - *appIcon
    dependencies:
      - target: Tasks-NotificationService-macOS
    settings:
      base:
        PRODUCT_NAME: Tasks
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tasks.macos
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    entitlements:
      path: macOS.entitlements
      properties:
        com.apple.developer.aps-environment: $(APNS_ENVIRONMENT)
        com.apple.developer.applesignin: [Default]
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
  # Adds the task's App Intents entity to each pushed reminder, so Siri can act on it.
  Tasks-NotificationService-iOS:
    type: app-extension
    platform: iOS
    sources: &serviceSources
      - path: NotificationService
        excludes: ["*.plist", "*.entitlements"]
      - Tasks/API.swift
      - Tasks/Models.swift
      - Tasks/TaskEntity.swift
    settings:
      base:
        PRODUCT_NAME: NotificationService-iOS
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tasks.ios.notifications
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Tasks
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  Tasks-NotificationService-macOS:
    type: app-extension
    platform: macOS
    sources: *serviceSources
    settings:
      base:
        PRODUCT_NAME: NotificationService-macOS
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tasks.macos.notifications
    info:
      path: NotificationService/Info-macOS.plist
      properties:
        CFBundleDisplayName: Tasks
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NotificationService/macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
  Tasks-iOS-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TasksUITests]
    dependencies:
      - target: Tasks-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tasks.uitests
        TEST_TARGET_NAME: Tasks-iOS
schemes:
  Tasks-iOS:
    build:
      targets:
        Tasks-iOS: all
        Tasks-iOS-UITests: [test]
    test:
      targets: [Tasks-iOS-UITests]
