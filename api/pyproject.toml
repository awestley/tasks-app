[project]
name = "tasks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pyjwt[crypto]>=2.10,<3",
  "httpx[http2]>=0.28,<1",
  "python-multipart>=0.0.20",
  "cryptography>=44",
  "alembic>=1.14,<2",
  "mcp>=1.26,<2",
  "pywebpush>=2.0,<3",
  "requests>=2.32,<3",
  "urllib3>=2.2,<3",
]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# FastAPI declares dependencies as default arguments. The formatter handles line length; long strings stay whole.
ignore = ["B008", "E501"]
